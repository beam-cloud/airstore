syntax = "proto3";

option go_package = "github.com/beam-cloud/airstore/proto";

package sources;

// SourceService provides read-only access to integration sources.
// The workspace is determined by the auth token - paths are relative to /sources.
service SourceService {
  // Stat returns file/directory attributes for a source path
  rpc Stat(SourceStatRequest) returns (SourceStatResponse);
  
  // ReadDir lists directory contents with enriched metadata
  rpc ReadDir(SourceReadDirRequest) returns (SourceReadDirResponse);
  
  // Read reads file content from a source
  rpc Read(SourceReadRequest) returns (SourceReadResponse);
  
  // Readlink reads a symbolic link target (for friendly aliases)
  rpc Readlink(SourceReadlinkRequest) returns (SourceReadlinkResponse);

  // Source view operations - create views from folder names via LLM inference or structured filters
  
  // CreateView creates a new source view (called on mkdir/touch)
  rpc CreateView(CreateViewRequest) returns (CreateViewResponse);
  
  // GetView retrieves a view by its path
  rpc GetView(GetViewRequest) returns (GetViewResponse);
  
  // ListViews lists views under a parent path
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse);
  
  // DeleteView removes a view by external_id
  rpc DeleteView(DeleteViewRequest) returns (DeleteViewResponse);

  // UpdateView updates an existing view's name/guidance
  rpc UpdateView(UpdateViewRequest) returns (UpdateViewResponse);

  // ExecuteView runs a view's query and returns materialized results
  rpc ExecuteView(ExecuteViewRequest) returns (ExecuteViewResponse);

  // SyncView re-executes a view's query, refreshing cached metadata
  rpc SyncView(SyncViewRequest) returns (SyncViewResponse);

  // ListResources returns available resources for an integration (repos, channels, etc.)
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
}

// SourceFileInfo contains file/directory metadata
message SourceFileInfo {
  int64 size = 1;
  uint32 mode = 2;
  int64 mtime = 3;  // Unix timestamp
  bool is_dir = 4;
  bool is_link = 5;
}

// SourceDirEntry represents a directory entry with full metadata
message SourceDirEntry {
  string name = 1;
  uint32 mode = 2;
  bool is_dir = 3;
  int64 size = 4;
  int64 mtime = 5;       // Unix timestamp
  string result_id = 6;  // Provider-specific ID for content retrieval (optional)
  int32 child_count = 7; // Number of children (for directories)
}

// Stat
message SourceStatRequest {
  string path = 1;  // Path relative to /sources (e.g., "github/views/repos.json")
}

message SourceStatResponse {
  bool ok = 1;
  string error = 2;
  SourceFileInfo info = 3;
}

// ReadDir
message SourceReadDirRequest {
  string path = 1;
}

message SourceReadDirResponse {
  bool ok = 1;
  string error = 2;
  repeated SourceDirEntry entries = 3;
}

// Read
message SourceReadRequest {
  string path = 1;
  int64 offset = 2;
  int64 length = 3;  // 0 means read to end
}

message SourceReadCostHint {
  string integration = 1;
  string source_uri = 2;
  string query_path = 3;
  string result_id = 4;
  string strategy = 5;
  string outcome = 6;
  int64 original_bytes = 7;
  int64 compressed_bytes = 8;
  int64 original_tokens = 9;
  int64 compressed_tokens = 10;
  int64 compression_ms = 11;
}

message SourceReadResponse {
  bool ok = 1;
  string error = 2;
  bytes data = 3;
  SourceReadCostHint cost_hint = 4;
}

// Readlink
message SourceReadlinkRequest {
  string path = 1;
}

message SourceReadlinkResponse {
  bool ok = 1;
  string error = 2;
  string target = 3;
}

// ==================== Source View Messages ====================

// SourceView represents a stored view that materializes as filesystem content.
// A view can be created via LLM inference (smart mode) or structured filters (query mode).
message SourceView {
  string external_id = 1;
  string integration = 2;      // "gmail", "gdrive", etc.
  string path = 3;             // Full path: "/sources/gmail/unread-emails"
  string name = 4;             // Folder/file name
  string query_spec = 5;       // JSON query params from LLM
  string guidance = 6;         // User-provided context for inference
  string output_format = 7;    // "folder" or "file"
  string file_ext = 8;         // For files: ".json", ".md"
  int32 cache_ttl = 9;         // Seconds, 0 = always live
  int64 created_at = 10;       // Unix timestamp
  int64 updated_at = 11;
  string mode = 12;            // "smart" or "query"
  string filter = 13;          // JSON structured filter (for query mode, enables round-trip editing)
}

// CreateView - creates a view from a folder/file name via LLM inference or structured filter
message CreateViewRequest {
  string integration = 1;      // e.g., "gmail"
  string name = 2;             // Folder name like "unread-emails"
  string guidance = 3;         // Optional extra context for LLM (smart mode)
  string output_format = 4;    // "folder" or "file"
  string file_ext = 5;         // For files: ".json", ".md"
  string filter = 6;           // JSON structured filter (query mode)
}

message CreateViewResponse {
  bool ok = 1;
  string error = 2;
  SourceView view = 3;
}

// GetView - retrieves a view by path
message GetViewRequest {
  string path = 1;             // Full path: "/sources/gmail/unread-emails"
}

message GetViewResponse {
  bool ok = 1;
  string error = 2;
  SourceView view = 3;        // nil if not found
}

// ListViews - lists views under a parent path
message ListViewsRequest {
  string parent_path = 1;      // e.g., "/sources/gmail"
}

message ListViewsResponse {
  bool ok = 1;
  string error = 2;
  repeated SourceView views = 3;
}

// DeleteView - removes a view by external_id
message DeleteViewRequest {
  string external_id = 1;        // Stable view ID (from SourceView.external_id)
}

message DeleteViewResponse {
  bool ok = 1;
  string error = 2;
}

// UpdateView - updates an existing view's name and/or guidance
message UpdateViewRequest {
  string external_id = 1;        // Stable view ID (from SourceView.external_id)
  string name = 2;               // New name (optional, triggers rename + path update)
  string guidance = 3;           // New guidance (triggers re-inference of query_spec)
  string filter = 4;             // New structured filter JSON (query mode)
}

message UpdateViewResponse {
  bool ok = 1;
  string error = 2;
  SourceView view = 3;
}

// ExecuteView - runs a view's query and returns results
message ExecuteViewRequest {
  string path = 1;             // View path: "/sources/gmail/unread-emails"
  string filename = 2;         // Optional: specific file to read from folder results
  string result_id = 3;        // Optional: provider-specific ID for direct content retrieval
}

message ExecuteViewResponse {
  bool ok = 1;
  string error = 2;
  repeated SourceDirEntry entries = 3;  // For folder mode: directory entries
  bytes file_data = 4;                   // For file mode or specific filename: content
}

// SyncView - re-executes a view's query, refreshing cached metadata
message SyncViewRequest {
  string external_id = 1;      // Stable view ID
}

message SyncViewResponse {
  bool ok = 1;
  string error = 2;
  SourceView view = 3;
  int32 results_count = 4;    // Total number of results after sync
  int32 new_results = 5;      // Number of newly detected results
}

// ListResources - returns available resources for an integration
message ListResourcesRequest {
  string integration = 1;      // e.g., "github", "slack"
  string resource_type = 2;    // e.g., "repos", "channels"
}

message ListResourcesResponse {
  bool ok = 1;
  string error = 2;
  repeated SourceResource resources = 3;
}

message SourceResource {
  string id = 1;       // Unique identifier (e.g., "owner/repo")
  string name = 2;     // Display name (e.g., "owner/repo", "#general")
}
