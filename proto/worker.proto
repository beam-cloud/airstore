syntax = "proto3";

option go_package = "github.com/beam-cloud/airstore/proto";

package worker;

service WorkerService {
  // Worker lifecycle
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  
  // Task lifecycle
  rpc SetTaskStarted(SetTaskStartedRequest) returns (SetTaskStartedResponse);
  rpc SetTaskResult(SetTaskResultRequest) returns (SetTaskResultResponse);
  rpc UpdateTaskState(UpdateTaskStateRequest) returns (UpdateTaskStateResponse);

  // Network/IP management for sandboxes
  rpc AllocateIP(AllocateIPRequest) returns (AllocateIPResponse);
  rpc ReleaseIP(ReleaseIPRequest) returns (ReleaseIPResponse);

  // Task input inbox (durable follow-up claims)
  rpc ClaimTaskInput(ClaimTaskInputRequest) returns (ClaimTaskInputResponse);
  rpc AckTaskInput(AckTaskInputRequest) returns (AckTaskInputResponse);

  // Task outputs
  rpc CreateTaskOutput(CreateTaskOutputRequest) returns (CreateTaskOutputResponse);
  rpc AppendTaskOutputRows(AppendTaskOutputRowsRequest) returns (AppendTaskOutputRowsResponse);
  rpc FinalizeTaskOutput(FinalizeTaskOutputRequest) returns (FinalizeTaskOutputResponse);
}

// Worker registration
message RegisterWorkerRequest {
  string hostname = 1;
  string pool_name = 2;
  int64 cpu = 3;
  int64 memory = 4;
  string version = 5;
}

message RegisterWorkerResponse {
  string worker_id = 1;
}

// Heartbeat
message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {}

// Status update
message UpdateStatusRequest {
  string worker_id = 1;
  string status = 2;
}

message UpdateStatusResponse {}

// Deregistration
message DeregisterRequest {
  string worker_id = 1;
}

message DeregisterResponse {}

// Get worker info
message GetWorkerRequest {
  string worker_id = 1;
}

message GetWorkerResponse {
  string id = 1;
  string status = 2;
  string pool_name = 3;
  string hostname = 4;
  int64 cpu = 5;
  int64 memory = 6;
  int64 last_seen_at = 7;
  int64 registered_at = 8;
  string version = 9;
}

// List workers
message ListWorkersRequest {}

message ListWorkersResponse {
  repeated GetWorkerResponse workers = 1;
}

// Task result reporting
message SetTaskStartedRequest {
  string task_id = 1;
  string attempt_id = 2;
}

message SetTaskStartedResponse {}

message WakeSignal {
  int32  delay_minutes    = 1;
  string reason           = 2;
  string follow_up_prompt = 3;
}

message SetTaskResultRequest {
  string task_id = 1;
  int32 exit_code = 2;
  string error = 3;
  string attempt_id = 4;
  bool waiting_for_input = 5;
  WakeSignal wake_signal = 6;
}

message SetTaskResultResponse {}

message UpdateTaskStateRequest {
  string task_id = 1;
  string state = 2;
  string run_id = 3;
  string input_kind = 4;
  string waiting_summary = 5;
}

message UpdateTaskStateResponse {}

// Task input inbox
message ClaimTaskInputRequest {
  string task_id = 1;
  string run_id = 2;
  string execution_id = 3;
}

message ClaimTaskInputResponse {
  bool found = 1;
  string input_id = 2;
  string message = 3;
  string kind = 4;
  string action = 5;
  int32 seq = 6;
}

message AckTaskInputRequest {
  string input_id = 1;
}

message AckTaskInputResponse {}

// IP allocation for sandbox networking
message AllocateIPRequest {
  string sandbox_id = 1;
  string worker_id = 2;
}

message AllocateIPResponse {
  string ip = 1;
  string gateway = 2;
  int32 prefix_len = 3;
  string ipv6 = 4;
  string gateway_ipv6 = 5;
  int32 prefix_len_ipv6 = 6;
}

message ReleaseIPRequest {
  string sandbox_id = 1;
}

message ReleaseIPResponse {}

// Task output messages
message CreateTaskOutputRequest {
  uint32 workspace_id = 1;
  string task_id = 2;
  string run_id = 3;
  string output_type = 4;
  string title = 5;
  string schema_json = 6;   // JSON-encoded schema
  string data_json = 7;     // JSON-encoded initial data
  string metadata_json = 8; // JSON-encoded metadata
  string uri = 9;            // External deep-link URI
  string agent_id = 10;
}

message CreateTaskOutputResponse {
  string id = 1;
}

message AppendTaskOutputRowsRequest {
  uint32 workspace_id = 1;
  string output_id = 2;
  string rows_json = 3; // JSON-encoded array of rows
}

message AppendTaskOutputRowsResponse {}

message FinalizeTaskOutputRequest {
  uint32 workspace_id = 1;
  string output_id = 2;
  string summary = 3;
}

message FinalizeTaskOutputResponse {}

