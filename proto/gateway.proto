syntax = "proto3";

option go_package = "github.com/beam-cloud/airstore/proto";

package gateway;

import "google/protobuf/struct.proto";

service GatewayService {
  // Workspaces
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (WorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (WorkspaceResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteResponse);

  // Members
  rpc AddMember(AddMemberRequest) returns (MemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (DeleteResponse);

  // Tokens (workspace-scoped)
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (DeleteResponse);

  // Worker Tokens (cluster-level)
  rpc CreateWorkerToken(CreateWorkerTokenRequest) returns (CreateTokenResponse);
  rpc ListWorkerTokens(ListWorkerTokensRequest) returns (ListTokensResponse);

  // Connections
  rpc AddConnection(AddConnectionRequest) returns (ConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc RemoveConnection(RemoveConnectionRequest) returns (DeleteResponse);

  // Hooks
  rpc CreateHook(CreateHookRequest) returns (HookResponse);
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);
  rpc GetHook(GetHookRequest) returns (HookResponse);
  rpc UpdateHook(UpdateHookRequest) returns (HookResponse);
  rpc DeleteHook(DeleteHookRequest) returns (DeleteResponse);
  rpc ListHookRuns(ListHookRunsRequest) returns (ListHookRunsResponse);
}

service AgentService {
  rpc CreateAgentProfile(CreateAgentProfileRequest) returns (AgentProfileResponse);
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse);
  rpc GetAgentProfile(GetAgentProfileRequest) returns (AgentProfileResponse);
  rpc CreateTask(CreateTaskRequest) returns (AgentTaskAcceptedResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (AgentTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteResponse);
  rpc GetTaskLogs(GetTaskLogsRequest) returns (GetTaskLogsResponse);
  rpc EnqueueRunInput(EnqueueRunInputRequest) returns (AgentTaskAcceptedResponse);
  rpc ListAgentRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse);
  rpc GetAgentRun(GetAgentRunRequest) returns (AgentRunResponse);
  rpc ListAgentRunSnapshots(ListAgentRunSnapshotsRequest) returns (ListAgentRunSnapshotsResponse);
  rpc ListAgentRunEvents(ListAgentRunEventsRequest) returns (ListAgentRunEventsResponse);
  rpc CancelAgentRun(CancelAgentRunRequest) returns (CancelAgentRunResponse);
}

// AccessLogService ingests batched logical read events from mounts.
service AccessLogService {
  rpc IngestAccessEvents(IngestAccessEventsRequest) returns (IngestAccessEventsResponse);
}

// Common
message DeleteResponse {
  bool ok = 1;
  string error = 2;
}

message AccessLogEvent {
  string event_id = 1;
  int64 ts = 2;
  string session_id = 3;
  string path = 4;
  string cache_source = 5;
  int64 offset = 6;
  int32 requested_bytes = 7;
  int32 read_bytes = 8;
  int64 latency_ms = 9;
  string error_msg = 10;
  string mount_id = 11;
  string access_origin = 12;
  string integration = 13;
  string source_uri = 14;
  string query_path = 15;
  string result_id = 16;
  int64 original_bytes = 17;
  int64 compressed_bytes = 18;
  int64 original_tokens = 19;
  int64 compressed_tokens = 20;
  string strategy = 21;
  string outcome = 22;
  int64 compression_ms = 23;
  int64 fetch_ms = 24; // e2e content fetch duration (e.g. time to fetch from source during Open)
}

message IngestAccessEventsRequest {
  repeated AccessLogEvent events = 1;
}

message IngestAccessEventsResponse {
  bool ok = 1;
  string error = 2;
  int32 accepted = 3;
}

// Workspace messages
message CreateWorkspaceRequest {
  string name = 1;
}

message ListWorkspacesRequest {}

message GetWorkspaceRequest {
  string id = 1;
}

message DeleteWorkspaceRequest {
  string id = 1;
}

message Workspace {
  string id = 1;
  string name = 2;
  string created_at = 3;
  string updated_at = 4;
}

message WorkspaceResponse {
  bool ok = 1;
  string error = 2;
  Workspace workspace = 3;
}

message ListWorkspacesResponse {
  bool ok = 1;
  string error = 2;
  repeated Workspace workspaces = 3;
}

// Member messages
message AddMemberRequest {
  string workspace_id = 1;
  string email = 2;
  string name = 3;
  string role = 4; // admin, member, viewer
}

message ListMembersRequest {
  string workspace_id = 1;
}

message RemoveMemberRequest {
  string id = 1;
}

message Member {
  string id = 1;
  string workspace_id = 2;
  string email = 3;
  string name = 4;
  string role = 5;
  string created_at = 6;
}

message MemberResponse {
  bool ok = 1;
  string error = 2;
  Member member = 3;
}

message ListMembersResponse {
  bool ok = 1;
  string error = 2;
  repeated Member members = 3;
}

// Token messages
message CreateTokenRequest {
  string workspace_id = 1;
  string member_id = 2;
  string name = 3;
  int64 expires_in_seconds = 4; // 0 = no expiry
}

message ListTokensRequest {
  string workspace_id = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message Token {
  string id = 1;
  string name = 2;
  string token_type = 3;        // "workspace_member" or "worker"
  string member_id = 4;         // Set for workspace_member tokens
  string pool_name = 5;         // Set for worker tokens (optional)
  string expires_at = 6;
  string created_at = 7;
  string last_used_at = 8;
}

// Worker token messages
message CreateWorkerTokenRequest {
  string name = 1;
  string pool_name = 2;          // Optional, empty = all pools
  int64 expires_in_seconds = 3;  // 0 = no expiry
}

message ListWorkerTokensRequest {
  // No parameters - lists all worker tokens
}

message CreateTokenResponse {
  bool ok = 1;
  string error = 2;
  string token = 3; // Raw token, only returned on create
  Token info = 4;
}

message ListTokensResponse {
  bool ok = 1;
  string error = 2;
  repeated Token tokens = 3;
}

// Connection messages
message AddConnectionRequest {
  string workspace_id = 1;
  string member_id = 2; // Empty = workspace-shared
  string integration_type = 3; // github, weather, exa, etc.
  string access_token = 4;
  string api_key = 5;
  string scope = 6;
  map<string, string> extra = 7; // Additional provider-specific data (e.g., host URL)
}

message ListConnectionsRequest {
  string workspace_id = 1;
}

message RemoveConnectionRequest {
  string id = 1;
}

message Connection {
  string id = 1;
  string workspace_id = 2;
  string member_id = 3;
  string integration_type = 4;
  string scope = 5;
  bool is_shared = 6;
  string created_at = 7;
}

message ConnectionResponse {
  bool ok = 1;
  string error = 2;
  Connection connection = 3;
}

message ListConnectionsResponse {
  bool ok = 1;
  string error = 2;
  repeated Connection connections = 3;
}

message CreateTaskRequest {
  string message = 1;
  string agent_id = 2;
  string session_id = 3;
  string session_key = 4;
  string idempotency_key = 5;
  string lane = 6;
  string extra_system_prompt = 7;
  optional bool deliver = 8;
  optional int32 timeout_ms = 9;
  google.protobuf.Struct policy = 10;
  google.protobuf.Struct input_provenance = 11;
  google.protobuf.Struct routing = 12;
  repeated google.protobuf.Struct attachments = 13;
  string label = 14;
  string spawned_by = 15;
}

message DeleteTaskRequest {
  string id = 1;
}

message ListTasksRequest {}

message ListTasksResponse {
  bool ok = 1;
  string error = 2;
  repeated AgentTask tasks = 3;
}

message GetTaskRequest {
  string id = 1;
}

message GetTaskLogsRequest {
  string id = 1;
}

message TaskLogEntry {
  string task_id = 1;
  int64 timestamp = 2;
  string stream = 3;
  string data = 4;
}

message GetTaskLogsResponse {
  bool ok = 1;
  string error = 2;
  repeated TaskLogEntry logs = 3;
}

// Agent, task, and run messages
message AgentProfile {
  string id = 1;
  string workspace_id = 2;
  string agent_key = 3;
  string name = 4;
  google.protobuf.Struct config = 5;
  bool active = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateAgentProfileRequest {
  string workspace_id = 1;
  string agent_key = 2;
  string name = 3;
  google.protobuf.Struct config = 4;
  bool active = 5;
  bool has_active = 6;
}

message ListAgentProfilesRequest {
  string workspace_id = 1;
}

message GetAgentProfileRequest {
  string workspace_id = 1;
  string agent_id = 2;
}

message AgentProfileResponse {
  bool ok = 1;
  string error = 2;
  AgentProfile agent = 3;
}

message ListAgentProfilesResponse {
  bool ok = 1;
  string error = 2;
  repeated AgentProfile agents = 3;
}

message AgentTask {
  string id = 1;
  string workspace_id = 2;
  string agent_id = 3;
  string kind = 4;
  string queue_mode = 5;
  string state = 6;
  string idempotency_key = 7;
  string target_run_id = 8;
  string dropped_reason = 9;
  string created_at = 10;
  string updated_at = 11;
}

message AgentTaskAcceptedResponse {
  bool ok = 1;
  string error = 2;
  bool accepted = 3;
  bool idempotent_hit = 4;
  AgentTask task = 5;
  string run_id = 6;
}

message AgentTaskResponse {
  bool ok = 1;
  string error = 2;
  AgentTask task = 3;
}

message EnqueueRunInputRequest {
  string workspace_id = 1;
  string run_id = 2;
  string message = 3;
  string queue_mode = 4;
  string idempotency_key = 5;
}

message AgentRun {
  string id = 1;
  string workspace_id = 2;
  string agent_id = 3;
  string origin_task_id = 4;
  string status = 5;
  string session_id = 6;
  string session_key = 7;
  string provider = 8;
  string model = 9;
  string exec_host = 10;
  string exec_security = 11;
  string exec_ask = 12;
  string runtime_type = 13;
  string workspace_access = 14;
  bool network_enabled = 15;
  bool interactive = 16;
  int32 timeout_ms = 17;
  string error = 18;
  string created_at = 19;
  string started_at = 20;
  string ended_at = 21;
}

message ListAgentRunsRequest {
  string workspace_id = 1;
  int32 limit = 2;
}

message ListAgentRunsResponse {
  bool ok = 1;
  string error = 2;
  repeated AgentRun runs = 3;
}

message GetAgentRunRequest {
  string workspace_id = 1;
  string run_id = 2;
}

message AgentRunResponse {
  bool ok = 1;
  string error = 2;
  AgentRun run = 3;
}

message AgentRunSnapshot {
  string id = 1;
  string run_id = 2;
  int64 seq = 3;
  string status = 4;
  int64 started_at_ms = 5;
  int64 ended_at_ms = 6;
  bool has_started_at_ms = 7;
  bool has_ended_at_ms = 8;
  string error = 9;
  int64 ts = 10;
}

message ListAgentRunSnapshotsRequest {
  string workspace_id = 1;
  string run_id = 2;
  int32 limit = 3;
}

message ListAgentRunSnapshotsResponse {
  bool ok = 1;
  string error = 2;
  repeated AgentRunSnapshot snapshots = 3;
}

message ListAgentRunEventsRequest {
  string workspace_id = 1;
  string run_id = 2;
}

message ListAgentRunEventsResponse {
  bool ok = 1;
  string error = 2;
  repeated string events_json = 3;
}

message CancelAgentRunRequest {
  string workspace_id = 1;
  string run_id = 2;
}

message CancelAgentRunResponse {
  bool ok = 1;
  string error = 2;
  string status = 3;
}

// Hook messages
message Hook {
  string id = 1;
  string workspace_id = 2;
  string path = 3;
  string prompt = 4;
  bool active = 5;
  string created_at = 6;
  string updated_at = 7;
  string skill_path = 8;
}

message CreateHookRequest {
  string workspace_id = 1;
  string path = 2;
  string prompt = 3;
  string skill_path = 4;
}

message ListHooksRequest {
  string workspace_id = 1;
}

message GetHookRequest {
  string id = 1;
}

message UpdateHookRequest {
  string id = 1;
  string prompt = 2;
  bool active = 3;
  bool has_active = 4;
  string skill_path = 5;
  bool has_skill_path = 6;
}

message DeleteHookRequest {
  string id = 1;
}

message HookResponse {
  bool ok = 1;
  string error = 2;
  Hook hook = 3;
}

message ListHooksResponse {
  bool ok = 1;
  string error = 2;
  repeated Hook hooks = 3;
}

message ListHookRunsRequest {
  string hook_id = 1;  // hook external ID
}

message HookRun {
  string task_id = 1;
  string status = 2;
  int32 attempt = 3;
  int32 max_attempts = 4;
  string error = 5;
  string created_at = 6;
  string finished_at = 7;
}

message ListHookRunsResponse {
  bool ok = 1;
  string error = 2;
  repeated HookRun runs = 3;
}

