name: github
description: Interact with GitHub repositories, issues, and pull requests
icon: github

commands:
  list-repos:
    description: List repositories for a user or organization
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "GitHub username or organization name"

      - name: type
        type: string
        default: all
        short: -t
        flag: --type
        description: "Repository type: all, owner, public, private, member"

      - name: limit
        type: int
        default: 30
        short: -n
        flag: --limit
        description: "Maximum number of repositories (1-100)"

  get-repo:
    description: Get detailed information about a repository
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner (username or org)"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

  list-prs:
    description: List pull requests for a repository
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: state
        type: string
        default: open
        short: -s
        flag: --state
        description: "PR state: open, closed, or all"

      - name: limit
        type: int
        default: 30
        short: -n
        flag: --limit
        description: "Maximum number of PRs (1-100)"

  get-pr:
    description: Get detailed information about a pull request
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: number
        type: int
        required: true
        position: 2
        description: "Pull request number"

  list-pr-files:
    description: List changed files for a pull request
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: number
        type: int
        required: true
        position: 2
        description: "Pull request number"

      - name: limit
        type: int
        default: 100
        short: -n
        flag: --limit
        description: "Maximum number of files to return (1-100)"

  comment-pr:
    description: Add a conversation comment to a pull request
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: number
        type: int
        required: true
        position: 2
        description: "Pull request number"

      - name: body
        type: string
        required: true
        position: 3
        description: "Comment body"

  review-pr:
    description: Submit a pull request review (comment, approve, or request changes)
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: number
        type: int
        required: true
        position: 2
        description: "Pull request number"

      - name: body
        type: string
        required: true
        position: 3
        description: "Review summary/body"

      - name: event
        type: string
        short: -e
        flag: --event
        default: COMMENT
        description: "Review event: COMMENT, APPROVE, REQUEST_CHANGES"

      - name: comments
        type: string
        short: -c
        flag: --comments
        description: "JSON array of inline diff comments: [{\"path\":\"file.go\",\"line\":10,\"body\":\"Fix this\"}]"

  create-pr:
    description: Create a pull request
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: title
        type: string
        required: true
        position: 2
        description: "Pull request title"

      - name: head
        type: string
        required: true
        short: -H
        flag: --head
        description: "Branch containing changes (e.g. feature-branch)"

      - name: base
        type: string
        required: true
        short: -b
        flag: --base
        description: "Branch to merge into (e.g. main)"

      - name: body
        type: string
        short: -d
        flag: --body
        description: "Pull request description"

      - name: draft
        type: bool
        flag: --draft
        description: "Create as draft PR"

  list-issues:
    description: List issues for a repository
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: state
        type: string
        default: open
        short: -s
        flag: --state
        description: "Issue state: open, closed, or all"

      - name: limit
        type: int
        default: 30
        short: -n
        flag: --limit
        description: "Maximum number of issues (1-100)"

  get-issue:
    description: Get detailed information about an issue
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: number
        type: int
        required: true
        position: 2
        description: "Issue number"

  create-issue:
    description: Create a new issue in a repository
    params:
      - name: owner
        type: string
        required: true
        position: 0
        description: "Repository owner"

      - name: repo
        type: string
        required: true
        position: 1
        description: "Repository name"

      - name: title
        type: string
        required: true
        position: 2
        description: "Issue title"

      - name: body
        type: string
        short: -b
        flag: --body
        description: "Issue body/description"
