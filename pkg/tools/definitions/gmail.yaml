name: gmail
description: Read and write operations for Gmail
icon: mail

commands:
  search:
    description: Search Gmail messages using standard Gmail search syntax
    params:
      - name: query
        type: string
        required: true
        position: 0
        description: "Gmail search query (e.g. 'from:someone subject:hello', 'is:unread', 'newer_than:7d')"

      - name: limit
        type: int
        default: 10
        short: -n
        flag: --limit
        description: "Maximum number of results (1-50)"

  get-thread:
    description: Read a full email thread by thread ID
    params:
      - name: thread_id
        type: string
        required: true
        position: 0
        description: "Gmail thread ID"

  get-message:
    description: Read a single email message by message ID
    params:
      - name: message_id
        type: string
        required: true
        position: 0
        description: "Gmail message ID"

  create-draft:
    description: Create a Gmail draft email
    params:
      - name: to
        type: string
        required: true
        position: 0
        description: "Recipient email address"

      - name: subject
        type: string
        required: true
        position: 1
        description: "Email subject"

      - name: body
        type: string
        required: true
        position: 2
        description: "Email body text"

      - name: thread_id
        type: string
        short: -t
        flag: --thread-id
        description: "Optional Gmail thread ID to draft within"

  send-email:
    write: true
    description: Send a Gmail email immediately. When sending a previously created draft, pass the draft_id to send and clean up the draft properly.
    params:
      - name: to
        type: string
        required: true
        position: 0
        description: "Recipient email address"

      - name: subject
        type: string
        required: true
        position: 1
        description: "Email subject"

      - name: body
        type: string
        required: true
        position: 2
        description: "Email body text"

      - name: thread_id
        type: string
        short: -t
        flag: --thread-id
        description: "Optional Gmail thread ID to send within"

      - name: draft_id
        type: string
        short: -d
        flag: --draft-id
        description: "Optional draft ID to delete after sending (from a previous create-draft)"
