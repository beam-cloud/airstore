name: gdrive
description: Write operations for Google Drive
icon: hard-drive

commands:
  create-folder:
    write: true
    description: Create a new folder in Google Drive
    params:
      - name: name
        type: string
        required: true
        position: 0
        description: "Folder name"

      - name: parent_id
        type: string
        short: -p
        flag: --parent
        description: "Optional parent folder ID"

  write-file:
    write: true
    description: Create a new file in Google Drive
    one_of_required:
      - [content, content_base64]
    params:
      - name: name
        type: string
        required: true
        position: 0
        description: "File name"

      - name: content
        type: string
        position: 1
        description: "File content (text). Provide this or content_base64, not both"

      - name: content_base64
        type: string
        flag: --content-base64
        description: "Base64-encoded file content (for binary files like PDFs, images)"

      - name: parent_id
        type: string
        short: -p
        flag: --parent
        description: "Optional parent folder ID"

      - name: mime_type
        type: string
        short: -m
        flag: --mime-type
        default: text/plain
        description: "MIME type for file content"

  update-file:
    write: true
    description: Overwrite an existing Google Drive file by ID
    one_of_required:
      - [content, content_base64]
    params:
      - name: file_id
        type: string
        required: true
        position: 0
        description: "Google Drive file ID"

      - name: content
        type: string
        position: 1
        description: "New file content (text). Provide this or content_base64, not both"

      - name: content_base64
        type: string
        flag: --content-base64
        description: "Base64-encoded file content (for binary files like PDFs, images)"

      - name: mime_type
        type: string
        short: -m
        flag: --mime-type
        default: text/plain
        description: "MIME type for file content"
