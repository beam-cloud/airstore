name: gdrive
description: Write operations for Google Drive
icon: hard-drive

commands:
  create-folder:
    description: Create a new folder in Google Drive
    params:
      - name: name
        type: string
        required: true
        position: 0
        description: "Folder name"

      - name: parent_id
        type: string
        short: -p
        flag: --parent
        description: "Optional parent folder ID"

  write-file:
    description: Create a new file in Google Drive
    params:
      - name: name
        type: string
        required: true
        position: 0
        description: "File name"

      - name: content
        type: string
        required: true
        position: 1
        description: "File content"

      - name: parent_id
        type: string
        short: -p
        flag: --parent
        description: "Optional parent folder ID"

      - name: mime_type
        type: string
        short: -m
        flag: --mime-type
        default: text/plain
        description: "MIME type for file content"

  update-file:
    description: Overwrite an existing Google Drive file by ID
    params:
      - name: file_id
        type: string
        required: true
        position: 0
        description: "Google Drive file ID"

      - name: content
        type: string
        required: true
        position: 1
        description: "New file content"

      - name: mime_type
        type: string
        short: -m
        flag: --mime-type
        default: text/plain
        description: "MIME type for file content"
