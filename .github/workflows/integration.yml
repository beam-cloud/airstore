name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  integration:
    name: Integration
    # Skip on forked PRs where secrets are unavailable.
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install matplotlib

      - name: Run integration tests
        env:
          AIRSTORE_WS_TOKEN: ${{ secrets.AIRSTORE_WS_TOKEN }}
          RESULTS_JSON: e2e/results.json
        run: bash e2e/integration_test.sh

      - name: Generate plots and summary
        if: always()
        run: |
          mkdir -p e2e/plots
          python e2e/plot_results.py e2e/results.json e2e/plots/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            e2e/results.json
            e2e/plots/
          retention-days: 30

      - name: Upload plots for PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="integration-plots-pr-${{ github.event.number }}"

          # Clean up previous release for this PR
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Upload plots as release assets (gives us renderable URLs)
          if ls e2e/plots/*.png 1>/dev/null 2>&1; then
            gh release create "$TAG" e2e/plots/*.png \
              --title "Integration Plots (PR #${{ github.event.number }})" \
              --notes "Auto-generated by CI. Safe to delete." \
              --prerelease
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the markdown summary
            const summaryPath = 'e2e/plots/summary.md';
            let body = '';
            if (fs.existsSync(summaryPath)) {
              body = fs.readFileSync(summaryPath, 'utf8');
            } else {
              body = '## :warning: Integration Tests\n\nNo summary generated. Check workflow logs.';
            }

            // Build image URLs from the release assets
            const tag = `integration-plots-pr-${context.issue.number}`;
            const baseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}`;

            const plots = [
              { label: 'Overall Compression', file: 'summary_donut.png' },
              { label: 'Raw vs Compressed Bytes', file: 'bytes_comparison.png' },
              { label: 'Token Comparison', file: 'token_comparison.png' },
              { label: 'Reduction by File', file: 'reduction_pct.png' },
              { label: 'Read Latency', file: 'latency_comparison.png' },
              { label: 'I/O Latency', file: 'io_latency.png' },
            ];

            // Only include plots that were actually generated
            const availablePlots = plots.filter(p =>
              fs.existsSync(`e2e/plots/${p.file}`)
            );

            if (availablePlots.length > 0) {
              body += '\n### Charts\n\n';
              body += '<table><tr>\n';
              for (const p of availablePlots.slice(0, 3)) {
                body += `<td align="center"><strong>${p.label}</strong><br/><img src="${baseUrl}/${p.file}" width="320"/></td>\n`;
              }
              body += '</tr>';
              if (availablePlots.length > 3) {
                body += '<tr>\n';
                for (const p of availablePlots.slice(3)) {
                  body += `<td align="center"><strong>${p.label}</strong><br/><img src="${baseUrl}/${p.file}" width="320"/></td>\n`;
                }
                body += '</tr>';
              }
              body += '</table>\n';
            }

            // Marker for idempotent updates
            const marker = '<!-- integration-test-results -->';
            body = marker + '\n' + body;

            // Find existing comment to update (no spam on re-runs)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
